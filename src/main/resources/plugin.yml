name: SleepMultiplier
main: dev.sleepmultiplier.SleepMultiplier
version: 1.1.0
api-version: '1.21'
description: Speeds up night based on sleepers in a configured world.
commands:
  sleepmultiplier:
    description: Reload SleepMultiplier configuration
    usage: /<command> reload
    aliases: [fastersleep]
    permission: sleepmultiplier.reload
permissions:
  sleepmultiplier.reload:
    description: Allows reloading SleepMultiplier
    default: op
