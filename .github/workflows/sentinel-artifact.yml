name: Sentinel artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build deployable plugin
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Stage stable Sentinel artifact
        run: |
          cp target/SleepMultiplier-1.2.0.jar plugin.jar
          jar tf plugin.jar | grep -Fxq 'plugin.yml'
      - name: Upload Sentinel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fastersleep-sentinel-paper
          path: plugin.jar
          if-no-files-found: error
          retention-days: 14
